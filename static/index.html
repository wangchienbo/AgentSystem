<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AgentSystem 龙虾系统</title>
    <style>
        :root {
            --bg: #f5f5f5; --surface: #ffffff; --border: #e0e0e0;
            --text: #111111; --accent: #6c5ce7; --accent-light: #a29bfe;
            --error: #e74c3c; --success: #27ae60; --sidebar-w: 280px;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); height: 100vh; display: flex; flex-direction: column; }

        /* ── Loading ── */
        #loadingScreen { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; }
        #loadingScreen .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Login ── */
        #loginScreen { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
        #loginScreen h2 { color: var(--accent); margin-bottom: 24px; font-size: 20px; }
        .login-box { background: var(--surface); border-radius: 12px; padding: 24px; width: 100%; max-width: 320px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .login-box input { width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; }
        .login-box input:focus { outline: none; border-color: var(--accent); }
        .login-box button { width: 100%; padding: 10px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
        .login-box button:hover { background: var(--accent-light); }
        #loginMsg { margin-top: 12px; font-size: 13px; text-align: center; min-height: 18px; }
        .loginMsg-error { color: var(--error); }
        .loginMsg-info { color: #666; }

        /* ── Chat ── */
        #chatScreen { display: none; flex: 1; flex-direction: column; }
        #chatHeader { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        #chatHeader .title { font-weight: 600; color: var(--accent); font-size: 15px; white-space: nowrap; }
        #chatHeader .user-info { font-size: 12px; color: #888; white-space: nowrap; }
        #headerLeft { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        #headerActions { display: flex; gap: 8px; flex-shrink: 0; }
        #headerActions button { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: #666; white-space: nowrap; }
        #headerActions button:hover { background: var(--bg); }

        /* ── Session Button & Dropdown ── */
        #session-btn-wrap { position: relative; display: inline-block; }
        #session-btn { cursor: pointer; font-size: 13px; color: var(--accent); background: var(--bg); border-radius: 6px; padding: 4px 10px; border: 1px solid var(--border); user-select: none; white-space: nowrap; }
        #session-btn:hover { background: #eee; }
        #session-dropdown { display: none; position: absolute; top: 100%; left: 0; margin-top: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.12); min-width: 240px; max-height: 320px; overflow-y: auto; z-index: 200; }
        #session-dropdown.show { display: block; }
        .sd-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 6px; border-bottom: 1px solid var(--border); }
        .sd-header span { font-weight: 600; font-size: 13px; color: #888; }
        .sd-header button { background: none; border: none; color: var(--accent); font-size: 12px; cursor: pointer; font-weight: 600; padding: 2px 6px; }
        .sd-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
        .sd-item:hover { background: #f8f8ff; }
        .sd-item.active { background: #eeeefe; font-weight: 600; color: var(--accent); }
        .sd-item .sd-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sd-item .sd-count { font-size: 11px; color: #aaa; margin: 0 8px; white-space: nowrap; }
        .sd-item .sd-del { background: none; border: none; color: #ccc; cursor: pointer; font-size: 14px; padding: 0 4px; visibility: hidden; }
        .sd-item:hover .sd-del { visibility: visible; }
        .sd-item .sd-del:hover { color: var(--error); }
        .sd-create { border-top: 1px solid var(--border); padding: 8px 12px; display: flex; gap: 6px; }
        .sd-create input { flex: 1; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 12px; }
        .sd-create button { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; }

        /* Chat layout */
        #chatBody { display: flex; flex: 1; overflow: hidden; }

        /* ── Sidebar Session Panel ── */
        #sessionSidebar { display: none; width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); flex-shrink: 0; flex-direction: column; overflow: hidden; }
        #sessionSidebar.show { display: flex; }
        .sb-header { padding: 14px 16px 10px; font-weight: 600; color: var(--accent); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .sb-header button { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--accent); }
        .sb-list { flex: 1; overflow-y: auto; }
        .sb-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f5f5f5; transition: background 0.15s; }
        .sb-item:hover { background: #f8f8ff; }
        .sb-item.active { background: #eeeefe; border-left: 3px solid var(--accent); }
        .sb-item .sbi-label { font-size: 14px; color: var(--text); font-weight: 500; margin-bottom: 2px; }
        .sb-item .sbi-meta { font-size: 11px; color: #aaa; display: flex; gap: 8px; }

        /* ── Messages ── */
        #messagesContainer { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; 
            -webkit-overflow-scrolling: touch; overscroll-behavior: contain; 
            contain: layout style paint; will-change: scroll-position; }
        .load-more-wrap { text-align: center; padding: 8px 0; flex-shrink: 0; }
        #loadMoreBtn { background: none; border: 1px solid var(--border); border-radius: 16px; padding: 6px 16px; font-size: 12px; color: #888; cursor: pointer; }
        #loadMoreBtn:hover { background: var(--bg); }
        #loadMoreBtn:disabled { opacity: 0.4; cursor: default; }
        .load-more-empty { font-size: 12px; color: #ccc; padding: 8px 0; }

        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; }
        .msg-user { align-self: flex-end; align-items: flex-end; }
        .msg-assistant { align-self: flex-start; align-items: flex-start; }
        .bubble { padding: 8px 12px; border-radius: 14px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
        .user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
        .assistant .bubble { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 4px; }
        .msg-time { font-size: 10px; color: #aaa; margin-top: 2px; padding: 0 4px; }

        /* Thinking indicator */
        .thinking { display: flex; align-items: center; gap: 6px; color: #888; font-size: 13px; padding: 8px 12px; }
        .thinking .dot { width: 6px; height: 6px; background: #aaa; border-radius: 50%; animation: bounce 1.2s infinite; }
        .thinking .dot:nth-child(2) { animation-delay: 0.2s; }
        .thinking .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-4px); } }

        #inputBar { background: var(--surface); border-top: 1px solid var(--border); padding: 8px 12px; display: flex; gap: 8px; align-items: flex-end; }
        #inputBox { flex: 1; resize: none; border: 1px solid var(--border); border-radius: 20px; padding: 8px 14px; font-size: 14px; line-height: 1.4; max-height: 120px; font-family: inherit; }
        #inputBox:focus { outline: none; border-color: var(--accent); }
        #sendBtn { background: var(--accent); color: #fff; border: none; border-radius: 20px; width: 48px; height: 36px; font-size: 18px; cursor: pointer; flex-shrink: 0; }
        #sendBtn:hover { background: var(--accent-light); }
        #sendBtn:disabled { background: #ccc; cursor: not-allowed; }

        /* Error toast */
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--error); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; display: none; z-index: 100; }

        /* ── Mobile ── */
        @media (max-width: 640px) {
            #sessionSidebar.show { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 300; width: 100%; }
            #sessionSidebar.show + #messagesContainer { display: none; }
        }
    </style>
</head>
<body>

<div id="loadingScreen">
    <div class="spinner"></div>
    <span style="color:#888;font-size:13px">加载中...</span>
</div>

<div id="loginScreen">
    <h2>🦞 AgentSystem</h2>
    <div class="login-box">
        <input type="text" id="username" placeholder="用户名" autocomplete="username" />
        <input type="password" id="password" placeholder="密码" autocomplete="current-password" />
        <button id="loginBtn">登录</button>
        <div id="loginMsg"></div>
    </div>
</div>

<div id="chatScreen">
    <div id="chatHeader">
        <div id="headerLeft">
            <div id="session-btn-wrap">
                <div id="session-btn" onclick="toggleSessionDropdown(event)">
                    💬 <span id="session-btn-label">对话</span> ▾
                </div>
                <div id="session-dropdown"></div>
            </div>
            <div class="title">🦞 AgentSystem</div>
        </div>
        <div id="headerRight" style="display:flex;align-items:center;gap:8px;">
            <div class="user-info" id="userDisplay"></div>
            <div id="headerActions">
                <button id="workbenchBtn" onclick="openWorkbench()" title="AI 操作系统工作台 — 大模型的自我进化之手">🖥️</button>
                <button id="sidebarToggleBtn" onclick="toggleSidebar()" title="会话列表">☰</button>
                <button id="clearBtn" title="清空对话">🗑</button>
                <button id="logoutBtn">退出</button>
            </div>
        </div>
    </div>
    <div id="chatBody">
        <div id="sessionSidebar">
            <div class="sb-header">
                <span>📋 对话列表</span>
                <button onclick="toggleSidebar()">✕</button>
            </div>
            <div class="sb-list" id="sidebarList"></div>
        </div>
        <div id="messagesContainer">
            <div id="messages">
                <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
                    <button id="loadMoreBtn" onclick="loadMoreHistory()">加载更多消息 ↺</button>
                </div>
            </div>
            <div id="inputBar">
                <textarea id="inputBox" rows="1" placeholder="输入消息，按 Enter 发送..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
                <button id="sendBtn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let sessionId = null;
let username = null;
let sending = false;
let sessions = [];
let historyTotal = 0;
let historyOffset = 0;
const PAGE_SIZE = 50;

// ── Init: check existing session ───────────────────────────────────────────
(async function init() {
    try {
        const resp = await fetch('/api/sessions', { credentials: 'include' });
        if (resp.ok) {
            const data = await resp.json();
            if (data.success && data.sessions && data.sessions.length > 0) {
                const cur = data.sessions.find(s => s.is_current) || data.sessions[0];
                sessionId = cur.session_id;
                // 尝试从 cookie 恢复会话名（登录返回的）
                // 回退从 session list 里找
                await rebuildSessions();
                await loadHistory();
                showChat();
                return;
            }
        }
    } catch(e) {
        console.warn('Session restore failed:', e);
    }
    showLogin();
})();

// ── Auth ────────────────────────────────────────────────────────────────────
document.getElementById('loginBtn').onclick = doLogin;
document.getElementById('password').onkeydown = e => { if(e.key === 'Enter') doLogin(); };

async function doLogin() {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    const msg = document.getElementById('loginMsg');
    if (!u) { msg.className = 'loginMsg-error'; msg.textContent = '请输入用户名'; return; }

    msg.className = 'loginMsg-info'; msg.textContent = '登录中...';
    try {
        const resp = await fetch('/login', {
            method: 'POST',
            credentials: 'include',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: `username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`
        });
        const data = await resp.json();
        if (data.success) {
            sessionId = data.session_id;
            username = data.username;
            msg.className = 'loginMsg-info'; msg.textContent = '登录成功，加载中...';
            const msgs = document.getElementById('messages');
            // 保留 loadMoreWrap
            const lw = document.getElementById('loadMoreWrap');
            msgs.innerHTML = '';
            if (lw) msgs.appendChild(lw);
            if (data.history && Array.isArray(data.history)) {
                historyTotal = data.history.length;
                historyOffset = Math.min(historyTotal, PAGE_SIZE);
                data.history.forEach(h => {
                    if (h.role === 'user') appendBubble('user', escHtml(h.content), h.timestamp);
                    else appendBubble('assistant', h.content, h.timestamp);
                });
            }
            scrollBottom();
            await rebuildSessions();
            showChat();
            updateLoadMoreBtn();
        } else {
            msg.className = 'loginMsg-error'; msg.textContent = data.error || '登录失败';
        }
    } catch(e) {
        msg.className = 'loginMsg-error'; msg.textContent = '网络错误';
    }
}

// ── Sessions ───────────────────────────────────────────────────────────────
async function rebuildSessions() {
    try {
        const resp = await fetch('/api/sessions', { credentials: 'include' });
        if (!resp.ok) return;
        const data = await resp.json();
        sessions = data.sessions || [];
        renderSessionUI();
    } catch(e) { console.warn('rebuildSessions failed:', e); }
}

function renderSessionUI() {
    // 更新下拉
    const dd = document.getElementById('session-dropdown');
    const cur = sessions.find(s => s.is_current) || sessions[0];
    // 更新按钮label
    document.getElementById('session-btn-label').textContent = (cur && cur.label) || '对话';

    let html = '<div class="sd-header"><span>💬 对话列表</span><button onclick="closeDropdown();toggleSidebar();">管理</button></div>';
    sessions.forEach(s => {
        const active = s.is_current ? ' active' : '';
        html += `<div class="sd-item${active}" onclick="switchSession('${s.session_id}')">
            <span class="sd-label">${escHtml(s.label)}</span>
            <span class="sd-count">${s.message_count}</span>
            <button class="sd-del" onclick="event.stopPropagation();deleteSession('${s.session_id}')">✕</button>
        </div>`;
    });
    html += '<div class="sd-create"><input id="sdNewName" placeholder="新对话名称..." /><button onclick="createSession()">新建</button></div>';
    dd.innerHTML = html;

    // 更新侧栏
    const sb = document.getElementById('sidebarList');
    let sbHtml = '';
    sessions.forEach(s => {
        const active = s.is_current ? ' active' : '';
        const timeAgo = s.last_active ? timeSince(s.last_active) : '';
        sbHtml += `<div class="sb-item${active}" onclick="switchSession('${s.session_id}');if(window.innerWidth<=640)toggleSidebar();">
            <div class="sbi-label">${escHtml(s.label)}</div>
            <div class="sbi-meta"><span>${s.message_count} 条消息</span>${timeAgo ? '<span>'+timeAgo+'</span>' : ''}</div>
        </div>`;
    });
    sb.innerHTML = sbHtml;
}

async function createSession() {
    const input = document.getElementById('sdNewName');
    const label = input ? input.value.trim() : '';
    try {
        const resp = await fetch('/api/sessions', {
            method: 'POST',
            credentials: 'include',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ label })
        });
        if (resp.ok) {
            if (input) input.value = '';
            await rebuildSessions();
            // 自动切换到新会话
            await switchToLastSession();
        } else {
            showToast('创建失败');
        }
    } catch(e) { showToast('网络错误'); }
}

async function switchToLastSession() {
    const resp = await fetch('/api/sessions', { credentials: 'include' });
    if (!resp.ok) return;
    const data = await resp.json();
    const cur = data.sessions.find(s => s.is_current) || data.sessions[0];
    if (cur) {
        await doSwitchSession(cur.session_id);
    }
}

async function switchSession(sid) {
    if (sid === sessionId) { closeDropdown(); return; }
    try {
        const resp = await fetch(`/api/sessions/${sid}/switch`, {
            method: 'POST', credentials: 'include'
        });
        if (resp.ok) {
            await doSwitchSession(sid);
        } else {
            showToast('切换失败');
        }
    } catch(e) { showToast('网络错误'); }
}

async function doSwitchSession(sid) {
    sessionId = sid;
    closeDropdown();
    await rebuildSessions();
    await loadHistory();
    scrollBottom();
}

async function deleteSession(sid) {
    if (!confirm('确定删除此对话？')) return;
    try {
        const resp = await fetch(`/api/sessions/${sid}`, {
            method: 'DELETE', credentials: 'include'
        });
        if (resp.ok) {
            await rebuildSessions();
            // 如果当前会话被删，切换到列表第一个
            if (sid === sessionId) {
                const s = sessions.find(x => true);
                if (s) await doSwitchSession(s.session_id);
            }
        } else {
            showToast('删除失败');
        }
    } catch(e) { showToast('网络错误'); }
}

// ── Sidebar ────────────────────────────────────────────────────────────────
function toggleSidebar() {
    const sb = document.getElementById('sessionSidebar');
    sb.classList.toggle('show');
}

// ── Dropdown ───────────────────────────────────────────────────────────────
function toggleSessionDropdown(e) {
    e.stopPropagation();
    const dd = document.getElementById('session-dropdown');
    dd.classList.toggle('show');
}
function closeDropdown() {
    document.getElementById('session-dropdown').classList.remove('show');
}
document.addEventListener('click', function(e) {
    const dd = document.getElementById('session-dropdown');
    const btn = document.getElementById('session-btn-wrap');
    if (dd.classList.contains('show') && !btn.contains(e.target)) {
        closeDropdown();
    }
});

// ── History (paginated) ─────────────────────────────────────────────────────
async function loadHistory() {
    if (!sessionId) return;
    try {
        const resp = await fetch(`/api/sessions/${sessionId}/history?limit=${PAGE_SIZE}&offset=0`, { credentials: 'include' });
        if (resp.ok) {
            const data = await resp.json();
            if (data.success) {
                historyTotal = data.total;
                historyOffset = Math.min(data.total, PAGE_SIZE);
                const msgs = document.getElementById('messages');
                const lw = document.getElementById('loadMoreWrap');
                msgs.innerHTML = '';
                if (lw) msgs.appendChild(lw);
                if (data.history) {
                    data.history.forEach(h => {
                        if (h.role === 'user') appendBubble('user', escHtml(h.content), h.timestamp);
                        else appendBubble('assistant', h.content, h.timestamp);
                    });
                }
                updateLoadMoreBtn();
                scrollBottom();
            }
        }
    } catch(e) { console.warn('History load failed:', e); }
}

async function loadMoreHistory() {
    const btn = document.getElementById('loadMoreBtn');
    if (!btn || btn.disabled) return;
    btn.disabled = true;
    btn.textContent = '加载中...';
    try {
        const resp = await fetch(`/api/sessions/${sessionId}/history?limit=${PAGE_SIZE}&offset=${historyOffset}`, { credentials: 'include' });
        if (resp.ok) {
            const data = await resp.json();
            if (data.success && data.history && data.history.length > 0) {
                historyOffset += data.history.length;
                // 反向追加（最老的在上）
                const msgs = document.getElementById('messages');
                const lw = document.getElementById('loadMoreWrap');
                data.history.reverse().forEach(h => {
                    const el = h.role === 'user'
                        ? createBubbleEl('user', escHtml(h.content), h.timestamp)
                        : createBubbleEl('assistant', h.content, h.timestamp);
                    if (lw && lw.nextSibling) {
                        msgs.insertBefore(el, lw.nextSibling);
                    } else {
                        msgs.insertBefore(el, msgs.firstChild.nextSibling || msgs.firstChild);
                    }
                });
                // 用 requestAnimationFrame 保持滚动位置
                updateLoadMoreBtn();
            } else {
                // 没有更多了
                const w = document.getElementById('loadMoreWrap');
                if (w) w.style.display = 'none';
            }
        }
    } catch(e) { console.warn('Load more failed:', e); }
    btn.disabled = false;
    btn.textContent = '加载更多消息 ↺';
}

function updateLoadMoreBtn() {
    const w = document.getElementById('loadMoreWrap');
    if (!w) return;
    const remaining = historyTotal - historyOffset;
    if (remaining > 0) {
        w.style.display = 'block';
        document.getElementById('loadMoreBtn').textContent = `加载更多消息 (还有 ${remaining} 条) ↺`;
    } else {
        w.style.display = 'none';
    }
}

// ── Chat ─────────────────────────────────────────────────────────────────────
async function sendMessage() {
    const text = document.getElementById('inputBox').value.trim();
    if (!text || sending) return;
    sending = true;
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('inputBox').value = '';
    autoResize(document.getElementById('inputBox'));

    appendBubble('user', escHtml(text));
    showThinking();

    try {
        const resp = await fetch('/api/chat', {
            method: 'POST',
            credentials: 'include',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ message: text, session_id: sessionId })
        });
        removeThinking();
        if (resp.ok) {
            const data = await resp.json();
            if (data.success) {
                appendBubble('assistant', formatAssistantResponse(data.response));
                historyTotal += 2;
                historyOffset += 2;
                updateLoadMoreBtn();
                // 更新会话列表（消息计数）
                await rebuildSessions();
            } else {
                appendBubble('assistant', `<span style="color:var(--error)">错误: ${escHtml(data.error || '未知错误')}</span>`);
            }
        } else {
            appendBubble('assistant', `<span style="color:var(--error)">HTTP ${resp.status}</span>`);
        }
    } catch(e) {
        removeThinking();
        appendBubble('assistant', `<span style="color:var(--error)">请求异常: ${e.message}</span>`);
    }
    sending = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('inputBox').focus();
}

// ── UI helpers ───────────────────────────────────────────────────────────────
function showLogin() {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('chatScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
}
function showChat() {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('chatScreen').style.display = 'flex';
    document.getElementById('userDisplay').textContent = username ? `👤 ${username}` : '';
}

function createBubbleEl(role, html, timestamp) {
    const w = document.createElement('div');
    w.className = `msg-wrapper msg-${role}`;
    const b = document.createElement('div');
    b.className = 'bubble';
    b.innerHTML = html;
    const t = document.createElement('div');
    t.className = 'msg-time';
    t.textContent = timestamp ? new Date(timestamp).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'}) : timeStr();
    w.appendChild(b);
    w.appendChild(t);
    return w;
}

function appendBubble(role, html, timestamp) {
    const msgs = document.getElementById('messages');
    const w = createBubbleEl(role, html, timestamp);
    msgs.appendChild(w);
    scrollBottom();
}

function showThinking() {
    const msgs = document.getElementById('messages');
    const w = document.createElement('div');
    w.className = 'msg-wrapper msg-assistant';
    w.id = 'thinkingEl';
    w.innerHTML = '<div class="thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span>思考中...</span></div>';
    msgs.appendChild(w);
    scrollBottom();
}
function removeThinking() {
    const el = document.getElementById('thinkingEl');
    if (el) el.remove();
}

function scrollBottom() {
    const msgs = document.getElementById('messages');
    requestAnimationFrame(() => { msgs.scrollTop = msgs.scrollHeight; });
}
function timeStr() {
    return new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
}
function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}
// ── 响应美化：把 AI 返回的 JSON 渲染成可读卡片/列表 ─────────────────────────
function formatAssistantResponse(content) {
    const s = String(content || '').trim();
    if (!s) return content;
    if (s[0] === '{' || s[0] === '[') {
        try { return renderJsonCard(JSON.parse(s)); } catch(e) { /* 非 JSON，原样 */ }
    }
    return content;
}
function renderJsonCard(obj) {
    if (obj && typeof obj === 'object') {
        if (Array.isArray(obj.novels)) return renderNovelList(obj.novels);
        if (obj.models && typeof obj.models === 'object') return renderModelList(obj.models);
        if (Array.isArray(obj.assets)) return renderAssetList(obj.assets);
    }
    return '<pre style="background:#f6f6f6;padding:10px;border-radius:8px;overflow-x:auto;font-size:12px;margin:0">'
        + escHtml(JSON.stringify(obj, null, 2)) + '</pre>';
}
function renderNovelList(novels) {
    if (!novels.length) return '<div style="color:#888">暂无小说</div>';
    const rows = novels.map(n => `
        <div style="border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px">
            <div style="font-weight:600">${escHtml(n.title || '未命名')} <span style="color:${n.status==='writing'?'var(--success)':'#888'};font-size:12px">${escHtml(n.status || '')}</span></div>
            <div style="font-size:12px;color:#666">${escHtml(n.genre || '')} · ${n.chapter_count ?? 0} 章 · ${n.char_count ?? 0} 角色</div>
            ${n.description ? `<div style="font-size:12px;color:#888;margin-top:4px">${escHtml(n.description)}</div>` : ''}
        </div>`).join('');
    return `<div><b>📚 小说列表</b>${rows}</div>`;
}
function renderModelList(models) {
    const entries = Object.entries(models || {});
    if (!entries.length) return '<div style="color:#888">暂无模型配置</div>';
    const rows = entries.map(([k, m]) => {
        const name = (m && (m.model || m.model_id)) || k;
        return `<div style="border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:6px;font-size:13px">🤖 <b>${escHtml(String(name))}</b> <span style="color:#888;font-size:12px">${escHtml(k)}</span></div>`;
    }).join('');
    return `<div><b>🧠 模型资源</b>${rows}</div>`;
}
function renderAssetList(assets) {
    if (!assets.length) return '<div style="color:#888">暂无资产</div>';
    const rows = assets.map(a => `
        <div style="border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:6px;font-size:13px">
            📦 <b>${escHtml(a.name || a.asset_id || '')}</b> <span style="color:#888">${escHtml(a.asset_type || '')}</span>
        </div>`).join('');
    return `<div><b>🗂️ 资产列表</b>${rows}</div>`;
}
function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3000);
}
function timeSince(iso) {
    const diff = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return '刚刚';
    if (mins < 60) return mins + '分钟前';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + '小时前';
    const days = Math.floor(hrs / 24);
    return days + '天前';
}

// ── Header actions ────────────────────────────────────────────────────────────
function openWorkbench() {
    window.open('/workbench', '_blank', 'noopener');
}
document.getElementById('clearBtn').onclick = () => {
    if (confirm('确定清空当前对话？')) {
        const msgs = document.getElementById('messages');
        const lw = document.getElementById('loadMoreWrap');
        msgs.innerHTML = '';
        if (lw) msgs.appendChild(lw);
        historyTotal = 0;
        historyOffset = 0;
        updateLoadMoreBtn();
    }
};
document.getElementById('logoutBtn').onclick = async () => {
    await fetch('/logout', { credentials: 'include' });
    document.cookie = 'session_id=; Max-Age=0';
    location.reload();
};
