<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AgentSystem · 新时代 AI 操作系统</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #141924; --panel2: #1b2230; --border: #263041;
    --text: #e8ecf4; --muted: #8b96a8; --accent: #5b8cff; --accent2: #7c6bff;
    --green: #3ddc84; --amber: #f5b942; --red: #ff5c6c; --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 20% -10%, #1a2336 0%, var(--bg) 55%);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  /* ── Top bar ── */
  header {
    display: flex; align-items: center; gap: 16px; padding: 14px 26px;
    border-bottom: 1px solid var(--border); background: rgba(11,14,20,.7); backdrop-filter: blur(10px);
    position: sticky; top: 0; z-index: 10;
  }
  .logo { width: 34px; height: 34px; border-radius: 9px; display:grid; place-items:center;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); font-weight: 800; font-size: 18px; }
  .brand { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
  .brand small { display:block; font-size: 10px; color: var(--muted); font-weight: 500; letter-spacing: 2px; }
  .spacer { flex: 1; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding: 6px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .chip b { color: var(--text); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
  /* ── Layout ── */
  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 22px; padding: 22px 26px; flex: 1; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  /* ── Left column ── */
  .col h2 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin: 6px 0 12px; }
  .app-card {
    background: linear-gradient(160deg, var(--panel2), var(--panel)); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 14px; transition: transform .15s, border-color .15s;
  }
  .app-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .app-head { display:flex; align-items:center; gap:12px; }
  .app-ico { width: 42px; height: 42px; border-radius: 12px; display:grid; place-items:center; font-size: 20px;
    background: linear-gradient(135deg, #2c3e6b, #1d2942); border:1px solid var(--border); }
  .app-name { font-weight: 700; font-size: 15px; }
  .app-ver { font-size: 11px; color: var(--muted); }
  .badge { margin-left:auto; font-size: 11px; padding: 4px 9px; border-radius: 999px; font-weight: 600; }
  .badge.running { background: rgba(61,220,132,.12); color: var(--green); }
  .badge.stopped { background: rgba(139,150,168,.12); color: var(--muted); }
  .app-desc { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin-top: 10px; }
  .app-actions { display:flex; gap:8px; margin-top: 12px; }
  /* ── Design panel ── */
  .design {
    background: linear-gradient(150deg, rgba(91,140,255,.12), rgba(124,107,255,.08));
    border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-top: 20px;
  }
  .design h3 { font-size: 14px; margin-bottom: 8px; }
  .design p { font-size: 12px; color: var(--muted); line-height:1.6; margin-bottom: 12px; }
  .design textarea {
    width: 100%; background: rgba(0,0,0,.3); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); padding: 10px 12px; font-size: 13px; min-height: 74px; resize: vertical; font-family: inherit;
  }
  textarea:focus, input:focus { outline: none; border-color: var(--accent); }
  /* ── Skill grid ── */
  .skill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .skill { cursor: pointer; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 13px 15px;
    transition: border-color .15s; }
  .skill:hover { border-color: var(--accent2); }
  .skill.expanded { border-color: var(--accent); }
  .skill-id { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; color: var(--accent2); font-weight:600; }
  .skill-desc { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .skill-detail { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); line-height: 1.7; }
  .skill-detail .row { display: flex; gap: 8px; margin-bottom: 4px; }
  .skill-detail .k { color: var(--accent); min-width: 72px; flex-shrink: 0; font-weight: 600; }
  .skill-detail .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; background: rgba(124,107,255,.12); color: var(--accent2); font-size: 11px; margin-right: 4px; }
  .skill-detail .cp { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--text); background: rgba(0,0,0,.25); border-radius: 6px; padding: 6px 8px; white-space: pre-wrap; word-break: break-word; }
  .empty { color: var(--muted); font-size: 13px; padding: 20px; text-align:center; border:1px dashed var(--border); border-radius:12px; }
  /* ── Governance ── */
  .gov { margin-top: 22px; background: linear-gradient(150deg, rgba(61,220,132,.08), rgba(245,185,66,.05)); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .gov h3 { font-size: 14px; margin-bottom: 12px; }
  .gov-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .gov-stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
  .gov-stat .n { font-size: 24px; font-weight: 800; color: var(--green); }
  .gov-stat .l { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .gov-actions { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
  .gov-actions .act { font-size: 11px; padding: 4px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--border); color: var(--text); }
  .gov-actions .act b { color: var(--amber); margin-left: 4px; }
  .gov-list { margin-top: 12px; max-height: 180px; overflow-y: auto; }
  .gov-list .item { font-size: 11.5px; color: var(--muted); padding: 6px 4px; border-bottom: 1px dashed var(--border); display: flex; gap: 8px; align-items: baseline; }
  .gov-list .item .a { color: var(--accent); font-weight: 600; font-family: ui-monospace, Menlo, monospace; }
  .gov-list .item .ok { color: var(--green); }
  .gov-list .item .fail { color: var(--red); }
  /* ── Buttons ── */
  .btn { cursor:pointer; border:none; border-radius:10px; padding:9px 14px; font-size:13px; font-weight:600; color:#fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); transition: opacity .15s, transform .1s; }
  .btn:hover { opacity:.9; } .btn:active { transform: scale(.97); }
  .btn.ghost { background: var(--panel2); border:1px solid var(--border); color: var(--text); }
  .btn.block { width:100%; margin-top:10px; }
  /* ── Console ── */
  .console { margin-top: 22px; }
  .console-box {
    background: #0a0d13; border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    font-family: ui-monospace, Menlo, monospace; font-size: 12.5px;
  }
  .console-head { padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border); color: var(--muted); font-size: 11px; letter-spacing: 1px; display:flex; align-items:center; gap:8px;}
  .console-body { max-height: 260px; overflow-y:auto; padding: 12px 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;}
  .console-body .sys { color: var(--accent); }
  .console-body .user { color: var(--green); }
  .console-input { display:flex; gap:8px; padding:10px; border-top:1px solid var(--border); }
  .console-input input { flex:1; background: rgba(0,0,0,.4); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:9px 12px; font-size:12.5px; font-family: inherit;}
  .loading { color: var(--amber); }
</style>
</head>
<body>
<header>
  <div class="logo">◈</div>
  <div class="brand">AgentSystem<small>新时代 AI 操作系统</small></div>
  <div class="spacer"></div>
  <span class="chip"><span class="dot"></span><b id="runningN">-</b> 个 App 运行中</span>
  <span class="chip">📦 <b id="appN">-</b> App · <b id="skillN">-</b> Skill</span>
</header>

<div class="layout">
  <!-- LEFT: Apps + Design -->
  <div class="col">
    <h2>已安装 App</h2>
    <div id="apps"></div>

    <div class="design">
      <h3>🧪 自由设计新 App</h3>
      <p>用自然语言描述你想要的应用，操作系统会用底层 <b>Skill 组合</b> 装配出一个可运行的新 App，无需写代码。</p>
      <textarea id="designInput" placeholder="例如：帮我做一个项目管理助手 App，能记录任务、提醒截止日期、生成周报…"></textarea>
      <button class="btn block" onclick="startDesign()">⚡ 用 Skill 组合生成 App</button>
    </div>
  </div>

  <!-- RIGHT: Skills + Console -->
  <div class="col">
    <h2>能力库 · Skill（可复用的原子能力）</h2>
    <div class="skill-grid" id="skills"></div>

    <div class="gov" id="govPanel" style="display:none">
      <h3>🛡️ 治理概览 · 审计 & 操作统计</h3>
      <div class="gov-grid" id="govStats"></div>
      <div class="gov-actions" id="govActions"></div>
      <div class="gov-list" id="govList"></div>
    </div>

    <div class="console">
      <h2 style="margin-top:6px;">系统命令行 · Shell</h2>
      <div class="console-box">
        <div class="console-head"><span class="dot" style="background:var(--accent)"></span> agent@ai-os ~ $</div>
        <div class="console-body" id="consoleBody">
          <span class="sys">◈ 欢迎使用 AgentSystem AI 操作系统。输入命令或自然语言来管理 App。</span>
        </div>
        <div class="console-input">
          <input id="cmdInput" placeholder="试试：看看我的App列表 / 帮我建一个监控App…" onkeydown="if(event.key==='Enter')sendCmd()">
          <button class="btn ghost" onclick="sendCmd()">发送</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const sessionId = 'workbench';

  async function load() {
    try {
      const d = await (await fetch('/api/os/overview')).json();
      $('appN').textContent = d.app_count;
      $('skillN').textContent = d.skill_count;
      $('runningN').textContent = d.running_count;
      renderApps(d.apps);
      renderSkills(d.skills);
      loadGovernance();
    } catch (e) {
      $('apps').innerHTML = '<div class="empty">无法连接系统内核</div>';
    }
  }

  async function loadGovernance() {
    try {
      const d = await (await fetch('/api/os/governance')).json();
      if (d.status !== 'ok') return;
      renderGovernance(d);
    } catch (e) { /* 治理数据不可用时不阻断页面 */ }
  }

  function renderGovernance(d) {
    $('govPanel').style.display = 'block';
    const audit = d.audit || {};
    const count = audit.count || 0;
    const actions = d.actions || {};
    const recent = audit.recent || [];
    const actionTotal = Object.values(actions).reduce((a, b) => a + b, 0);
    $('govStats').innerHTML = `
      <div class="gov-stat"><div class="n">${count}</div><div class="l">今日审计事件</div></div>
      <div class="gov-stat"><div class="n">${actionTotal}</div><div class="l">操作统计</div></div>
      <div class="gov-stat"><div class="n">${Object.keys(actions).length}</div><div class="l">动作类型</div></div>
      <div class="gov-stat"><div class="n">${recent.length}</div><div class="l">最近记录</div></div>
    `;
    $('govActions').innerHTML = Object.entries(actions).map(([k, v]) =>
      `<span class="act">${esc(k)}<b>${v}</b></span>`).join('') || '<span class="act">暂无操作记录</span>';
    $('govList').innerHTML = recent.length ? recent.map(e => `
      <div class="item">
        <span class="a">${esc(e.action)}</span>
        <span>${esc(e.target_id || '—')}</span>
        <span class="${e.result === 'success' ? 'ok' : 'fail'}">${esc(e.result)}</span>
        <span>${esc(new Date(e.timestamp).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'}))}</span>
      </div>`).join('') : '<div class="item" style="border:none">今日暂无审计记录</div>';
  }

  function renderApps(apps) {
    const box = $('apps');
    if (!apps.length) { box.innerHTML = '<div class="empty">暂无 App，点击右侧「自由设计」创建一个</div>'; return; }
    box.innerHTML = apps.map(a => `
      <div class="app-card">
        <div class="app-head">
          <div class="app-ico">📱</div>
          <div>
            <div class="app-name">${esc(a.name)}</div>
            <div class="app-ver">v${esc(a.version)} · ${esc(a.app_shape || 'generic')}</div>
          </div>
          <span class="badge ${a.status === 'running' ? 'running' : 'stopped'}">${a.status === 'running' ? '● 运行中' : '○ 已停止'}</span>
        </div>
        <div class="app-desc">${esc(a.description || '暂无描述')}</div>
        <div class="app-actions">
          <button class="btn ghost" onclick="openApp('${esc(a.app_id)}')">打开</button>
          ${a.status === 'running'
            ? `<button class="btn ghost" onclick="appLifecycle('${esc(a.app_id)}','stop',this)">⏹ 停止</button>`
            : `<button class="btn ghost" onclick="appLifecycle('${esc(a.app_id)}','start',this)">▶ 启动</button>`}
          <button class="btn ghost" onclick="appDelete('${esc(a.app_id)}', this)">🗑 删除</button>
          <button class="btn ghost" onclick="sendCmd('介绍一下 ${esc(a.name)}')">ℹ 介绍</button>
        </div>
      </div>`).join('');
  }

  function renderSkills(skills) {
    const box = $('skills');
    if (!skills.length) { box.innerHTML = '<div class="empty">暂无可用 Skill</div>'; return; }
    box.innerHTML = skills.map(s => `
      <div class="skill" id="skill-${esc(s.skill_id)}" onclick="toggleSkillDetail('${esc(s.skill_id)}', this)">
        <div class="skill-id">${esc(s.skill_id)}</div>
        <div class="skill-desc">${esc(s.description || s.name)}</div>
        <div class="skill-detail" id="detail-${esc(s.skill_id)}" style="display:none"></div>
      </div>`).join('');
  }

  // 点击 skill 卡片 -> 拉取详情并展开/收起（工作台可发现性 OS5）
  async function toggleSkillDetail(skillId, el) {
    const detailBox = document.getElementById('detail-' + skillId);
    if (!detailBox) return;
    if (detailBox.style.display !== 'none') {
      detailBox.style.display = 'none';
      el.classList.remove('expanded');
      return;
    }
    if (detailBox.getAttribute('data-loaded') !== '1') {
      detailBox.innerHTML = '<span class="loading">⏳ 加载详情…</span>';
      try {
        const resp = await fetch('/api/os/skills/' + encodeURIComponent(skillId));
        const d = await resp.json();
        if (d.status === 'ok') {
          detailBox.innerHTML = buildSkillDetail(d.skill);
          detailBox.setAttribute('data-loaded', '1');
        } else {
          detailBox.innerHTML = `<span style="color:var(--red)">⚠ ${esc(d.error || '加载失败')}</span>`;
        }
      } catch (e) {
        detailBox.innerHTML = `<span style="color:var(--red)">⚠ ${esc(String(e))}</span>`;
      }
    }
    detailBox.style.display = 'block';
    el.classList.add('expanded');
  }

  function buildSkillDetail(s) {
    const cp = s.capability_profile && Object.keys(s.capability_profile).length
      ? JSON.stringify(s.capability_profile, null, 1) : '';
    const deps = (s.dependencies && s.dependencies.length)
      ? s.dependencies.join(', ') : '无';
    const tags = (s.tags && s.tags.length)
      ? s.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('') : '—';
    return `
      <div class="row"><span class="k">适配器</span><span>${esc(s.runtime_adapter || '—')}</span></div>
      <div class="row"><span class="k">版本</span><span>v${esc(s.active_version || '—')} · ${esc(s.origin || '—')} · ${esc(s.status || '—')}</span></div>
      <div class="row"><span class="k">依赖</span><span>${esc(deps)}</span></div>
      <div class="row"><span class="k">标签</span><span>${tags}</span></div>
      ${cp ? `<div class="row"><span class="k">能力画像</span></div><div class="cp">${esc(cp)}</div>` : ''}
    `;
  }

  function startDesign() {
    const text = $('designInput').value.trim();
    if (!text) { alert('请先描述你想创建的 App'); return; }
    sendCmd(text, true);
  }

  async function sendCmd(text, fromDesign) {
    const msg = (text !== undefined) ? text : $('cmdInput').value.trim();
    if (!msg) return;
    if (!fromDesign) $('cmdInput').value = '';
    const body = $('consoleBody');
    body.insertAdjacentHTML('beforeend', `<div class="user">❯ ${esc(msg)}</div>`);
    body.insertAdjacentHTML('beforeend', `<div class="loading">⏳ 思考中…</div>`);
    body.scrollTop = body.scrollHeight;
    try {
      const resp = await fetch('/api/chat', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ message: msg, session_id: sessionId })
      });
      const d = await resp.json();
      body.querySelector('.loading')?.remove();
      body.insertAdjacentHTML('beforeend', `<div class="sys">${esc(d.response || '(无响应)')}</div>`);
    } catch (e) {
      body.querySelector('.loading')?.remove();
      body.insertAdjacentHTML('beforeend', `<div class="sys" style="color:var(--red)">⚠ 请求失败：${esc(String(e))}</div>`);
    }
    body.scrollTop = body.scrollHeight;
  }

  function openApp(id) { sendCmd('打开 ' + id); }

  async function appLifecycle(appId, action, btn) {
    if (btn) { btn.disabled = true; btn.textContent = '…'; }
    try {
      const resp = await fetch(`/api/os/apps/${encodeURIComponent(appId)}/${action}`, { method: 'POST' });
      const d = await resp.json();
      const ok = d.status === 'success';
      // 无论成功失败，重新加载以刷新状态 + 治理数据
      await load();
      const msg = ok ? `✅ ${action} 成功` : `⚠ ${d.message || action + '失败'}`;
      if (!ok) alert(msg);
    } catch (e) {
      if (btn) { btn.disabled = false; }
      alert('请求失败: ' + e);
    }
  }

  async function appDelete(appId, btn) {
    if (!confirm(`确定删除 App「${appId}」？此操作不可撤销。`)) return;
    if (btn) { btn.disabled = true; btn.textContent = '…'; }
    try {
      const resp = await fetch(`/api/os/apps/${encodeURIComponent(appId)}`, { method: 'DELETE' });
      const d = await resp.json();
      const ok = d.status === 'success';
      await load();
      if (!ok) alert(d.message || '删除失败');
    } catch (e) {
      if (btn) { btn.disabled = false; }
      alert('请求失败: ' + e);
    }
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  load();
</script>
</body>
</html>
